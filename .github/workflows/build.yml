# Compiles the mod on every push and publishes the jar as the "latest" GitHub release,
# so it can be downloaded directly from the Releases page.
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '25'

      # The repository has no Gradle wrapper jar, so Gradle is installed by the action instead.
      - name: Setup Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'

      - name: Build
        run: gradle build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: autowalktoggle
          path: build/libs/

      - name: Publish "latest" release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources.jar$')
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest "$JAR" \
            --target "$GITHUB_SHA" \
            --title "AutoWalk Toggle (latest build)" \
            --notes "Built automatically from commit $GITHUB_SHA. Install it in .minecraft/mods together with Fabric API." \
            --latest
